name: Sync match results

on:
  schedule:
    # Cada 10 minutos (GitHub puede demorar algunos minutos extra en horas punta)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://polla-mundialera-5420.vercel.app/api/sync)
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "Status: $status"
          echo "Response: $body"
          if [ "$status" -ne 200 ]; then
            exit 1
          fi
